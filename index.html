<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Study App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .upload-section {
            border: 2px dashed #667eea;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            margin-bottom: 20px;
            background: #f8f9ff;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-section:hover {
            border-color: #764ba2;
            background: #f0f1ff;
        }

        .upload-section.dragover {
            border-color: #764ba2;
            background: #e8e9ff;
            transform: scale(1.02);
        }

        #fileInput {
            display: none;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .upload-text {
            color: #667eea;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .upload-hint {
            color: #999;
            font-size: 14px;
        }

        .csv-format {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 13px;
            text-align: left;
        }

        .csv-format code {
            background: #e0e0e0;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
        }

        .sample-section {
            text-align: center;
            margin-bottom: 20px;
        }

        .sample-section button {
            background: #2ecc71;
        }

        .sample-section button:hover {
            background: #27ae60;
        }

        .flashcard-container {
            display: none;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9ff;
            border-radius: 10px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .flashcard {
            background: white;
            border-radius: 15px;
            padding: 60px 40px;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: transform 0.3s ease;
            position: relative;
            border: 2px solid #e0e0e0;
        }

        .flashcard:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        .topic {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .difficulty {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .card-content {
            text-align: center;
            font-size: 20px;
            color: #333;
            line-height: 1.6;
        }

        .question {
            font-weight: 600;
            color: #667eea;
        }

        .answer {
            color: #2ecc71;
            font-weight: 500;
        }

        .flip-hint {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 12px;
            color: #999;
        }

        .review-btn {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: #f39c12;
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .review-btn:hover {
            background: #e67e22;
            transform: translateY(-2px);
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            justify-content: center;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .secondary-btn {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .secondary-btn:hover {
            background: #667eea;
            color: white;
        }

        .shuffle-btn {
            background: #764ba2;
        }

        .shuffle-btn:hover {
            background: #5a3a7a;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .flashcard {
                padding: 40px 20px;
                min-height: 250px;
            }

            .controls {
                flex-wrap: wrap;
            }

            button {
                padding: 10px 20px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📚 Flashcard Study App</h1>
    <p class="subtitle">Upload your CSV file to start studying</p>
    <div class="sample-section" id="sampleSection">
    <button onclick="loadSampleCSV()">Try Sample Flashcards</button>
    </div>
    <div class="upload-section" id="uploadSection">
        <div class="upload-icon">📁</div>
        <div class="upload-text">Click to upload or drag and drop</div>
        <div class="upload-hint">CSV files only</div>
        <input type="file" id="fileInput" accept=".csv">

        <div class="csv-format">
            <strong>CSV Format:</strong><br>
            First row: <code>Topic,Difficulty,Question,Answer</code><br>
            Example: <code>Math,What is 2+2?,4</code>
        </div>
    </div>

    <div class="flashcard-container" id="flashcardContainer">
        <div class="stats">
            <div class="stat-item">
                <div class="stat-label">Card</div>
                <div class="stat-value" id="currentCard">1</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Total Cards</div>
                <div class="stat-value" id="totalCards">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">To Review</div>
                <div class="stat-value" id="reviewCount">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Progress</div>
                <div class="stat-value" id="progress">0%</div>
            </div>
        </div>

        <div class="flashcard" id="flashcard">
            <div class="topic" id="topic">Topic</div>
            <div class="difficulty" id="difficulty">Difficulty</div>
            <div class="card-content" id="cardContent">
                <div class="question" id="question">Question</div>
            </div>
            <div class="flip-hint">Click to flip</div>
            <button class="review-btn" id="reviewBtn" onclick="toggleReview(event)">⚑ Mark for Review</button>
        </div>

        <div class="controls">
            <button onclick="previousCard()" id="prevBtn">← Previous</button>
            <button onclick="nextCard()" id="nextBtn">Next →</button>
            <button onclick="shuffleCards()" class="shuffle-btn">🔀 Shuffle</button>
            <button onclick="toggleReviewMode()" id="reviewModeBtn" class="review-mode-btn">Show Review Cards</button>
            <button onclick="reset()" class="secondary-btn">Upload New File</button>
        </div>
    </div>
</div>

<script>
    let flashcards = [];
    let allFlashcards = [];
    let currentIndex = 0;
    let isFlipped = false;
    let reviewMode = false;

    const uploadSection = document.getElementById('uploadSection');
    const sampleSection = document.getElementById('sampleSection');
    const fileInput = document.getElementById('fileInput');
    const flashcardContainer = document.getElementById('flashcardContainer');
    const flashcard = document.getElementById('flashcard');

    async function loadSampleCSV() {
        const response = await fetch('wine_flashcards.csv');
        const csv = await response.text();
        parseCSV(csv);
    }

    // Upload section click
    uploadSection.addEventListener('click', () => fileInput.click());

    // Drag and drop
    uploadSection.addEventListener('dragover', (e) => {
        e.preventDefault();
        uploadSection.classList.add('dragover');
    });

    uploadSection.addEventListener('dragleave', () => {
        uploadSection.classList.remove('dragover');
    });

    uploadSection.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadSection.classList.remove('dragover');
        const file = e.dataTransfer.files[0];
        if (file && file.name.endsWith('.csv')) {
            handleFile(file);
        }
    });

    // File input change
    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            handleFile(file);
        }
    });

    // Flashcard click to flip
    flashcard.addEventListener('click', flipCard);

    function handleFile(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const csv = e.target.result;
            parseCSV(csv);
        };
        reader.readAsText(file);
    }

    function parseCSV(csv) {
        const lines = csv.split('\n').filter(line => line.trim());

        // Skip header row
        const dataLines = lines.slice(1);

        flashcards = dataLines.map(line => {
            // Simple CSV parsing (handles basic cases)
            const matches = line.match(/(".*?"|[^,]+)(?=\s*,|\s*$)/g);
            if (matches && matches.length >= 3) {
                return {
                    topic: matches[0].replace(/"/g, '').trim(),
                    difficulty: matches[1].replace(/"/g, '').trim(),
                    question: matches[2].replace(/"/g, '').trim(),
                    answer: matches[3].replace(/"/g, '').trim(),
                    needsReview: false
                };
            }
            return null;
        }).filter(card => card !== null);

        if (flashcards.length > 0) {
            allFlashcards = [...flashcards]
            currentIndex = 0;
            uploadSection.style.display = 'none';
            sampleSection.style.display = 'none';
            flashcardContainer.style.display = 'block';
            showCard();
            updateReviewCount();
        } else {
            alert('No valid flashcards found in the CSV file. Please check the format.');
        }
    }

    function showCard() {
        if (flashcards.length === 0) return;

        const card = flashcards[currentIndex];
        document.getElementById('topic').textContent = card.topic;

        const difficultyElement = document.getElementById('difficulty');
        if (difficultyElement && card.difficulty) {
            difficultyElement.textContent = card.difficulty;

            // Set background color based on difficulty
            const difficulty = card.difficulty.toLowerCase();
            if (difficulty === 'easy') {
                difficultyElement.style.background = '#2ecc71'; // Green
            } else if (difficulty === 'medium') {
                difficultyElement.style.background = '#f39c12'; // Orange
            } else if (difficulty === 'hard') {
                difficultyElement.style.background = '#e74c3c'; // Red
            } else {
                difficultyElement.style.background = '#667eea'; // Default purple
            }
        }

        document.getElementById('currentCard').textContent = currentIndex + 1;
        document.getElementById('totalCards').textContent = flashcards.length;
        document.getElementById('progress').textContent =
            Math.round(((currentIndex + 1) / flashcards.length) * 100) + '%';

        isFlipped = false;
        document.getElementById('cardContent').innerHTML =
            `<div class="question">${card.question}</div>`;

        // Update button states
        document.getElementById('prevBtn').disabled = currentIndex === 0;
        document.getElementById('nextBtn').disabled = currentIndex === flashcards.length - 1;
        updateReviewBtn()
    }

    function flipCard() {
        const card = flashcards[currentIndex];
        const cardContent = document.getElementById('cardContent');

        if (!isFlipped) {
            cardContent.innerHTML = `<div class="answer">${card.answer}</div>`;
        } else {
            cardContent.innerHTML = `<div class="question">${card.question}</div>`;
        }
        isFlipped = !isFlipped;
    }

    function toggleReview(event) {
        event.stopPropagation();

        flashcards[currentIndex].needsReview = !flashcards[currentIndex].needsReview;

        updateReviewBtn()
        updateReviewCount()

        if (reviewMode && !flashcards[currentIndex].needsReview) {
            const reviewCount = allFlashcards.filter(card => card.needsReview).length;

            if (reviewCount === 0) {
                toggleReviewMode();
            } else {
                flashcards = allFlashcards.filter(card => card.needsReview);

                if (currentIndex >= flashcards.length) {
                    currentIndex = 0;
                }

                showCard()
            }

        }
    }

    function updateReviewBtn () {
        const button = document.getElementById('reviewBtn');
        if (flashcards[currentIndex].needsReview) {
            button.textContent = '✓ Marked for Review'
            button.style.background = '#e74c3c';
        } else {
            button.textContent = '⚑ Mark for Review';
            button.style.background = '#f39c12';
        }
    }

    function updateReviewCount() {
        const count = allFlashcards.filter(card => card.needsReview).length;
        document.getElementById('reviewCount').textContent = count;

        const reviewModeBtn = document.getElementById('reviewModeBtn');
        reviewModeBtn.disabled = (count === 0);
    }

    function toggleReviewMode() {
        reviewMode = !reviewMode;
        const button = document.getElementById('reviewModeBtn');
        const currentCard = flashcards[currentIndex];

        if (reviewMode) {
            flashcards = allFlashcards.filter(card => card.needsReview);
            button.textContent = 'Show All Cards'
            currentIndex = 0
        } else {
            flashcards = allFlashcards;
            button.textContent = 'Show Review Cards';

            const newIndex = flashcards.indexOf(currentCard)
            currentIndex = (newIndex !== -1) ? newIndex : 0;
        }

        showCard();
    }

    function nextCard() {
        if (currentIndex < flashcards.length - 1) {
            currentIndex++;
            showCard();
        }
    }

    function previousCard() {
        if (currentIndex > 0) {
            currentIndex--;
            showCard();
        }
    }

    function shuffleCards() {
        for (let i = flashcards.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [flashcards[i], flashcards[j]] = [flashcards[j], flashcards[i]];
        }
        currentIndex = 0;
        showCard();
    }

    function reset() {
        flashcards = [];
        currentIndex = 0;
        isFlipped = false;
        fileInput.value = '';
        uploadSection.style.display = 'block';
        sampleSection.style.display = 'block';
        flashcardContainer.style.display = 'none';
    }

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
        if (flashcards.length === 0) return;

        if (e.key === 'ArrowRight' || e.key === ' ') {
            e.preventDefault();
            if (isFlipped) {
                nextCard();
            } else {
                flipCard();
            }
        } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            previousCard();
        } else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
            e.preventDefault();
            flipCard();
        }
    });
</script>
</body>
</html>
